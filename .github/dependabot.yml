version: 2
updates:
  # Maintain Cargo dependencies for Soroban Smart Contracts
  - package-ecosystem: "cargo"
    directory: "/soroban-contracts/royalty-vault"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "soroban"

  # Maintain pnpm / npm dependencies for Monorepo
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
